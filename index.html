<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alien's Valentine Patch</title>
    <style>
        :root { --sky: #87CEEB; --orange: #FFA500; --yellow: #FFD700; }
        body { background: #f0f0f0; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* The Card Container */
        .card { position: relative; width: 320px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); overflow: hidden; text-align: center; border: 4px solid var(--orange); }

        /* The Message (Hidden Underneath) */
        .message-layer { padding: 30px; display: flex; flex-direction: column; justify-content: center; height: 100%; box-sizing: border-box; }
        .message-layer h2 { color: var(--orange); margin-top: 0; }
        .message-layer p { color: #555; line-height: 1.6; font-size: 0.95rem; }

        /* The Cover (The part she taps) */
        .cover-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--sky); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: opacity 1s, visibility 1s; z-index: 2; color: white; }
        .cover-layer h1 { font-size: 1.5rem; margin-bottom: 10px; }
        .heart-icon { font-size: 60px; animation: pulse 1.5s infinite; }

        .btn { background: var(--orange); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; text-decoration: none; display: inline-block; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Class to hide the cover */
        .hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>

    <div class="card">
        <!-- THE COVER -->
        <div class="cover-layer" id="cover" onclick="reveal()">
            <div class="heart-icon">👽</div>
            <h1>TAP TO UNLOCK</h1>
            <p style="font-size: 0.8rem;">A special patch from the Alien</p>
        </div>

        <!-- THE MESSAGE -->
        <div class="message-layer">
            <h2>SURPRISE! 🧡</h2>
            <p>I know things were buggy before, but I've updated my code. Distance between our schools is just a number; the spark is still here. Ready to 're-install' us? Happy Val's Day!</p>
            <a href="https://wa.me🚀" class="btn">SEND PATCH REQUEST</a>
        </div>
    </div>

    <script>
        function reveal() {
            document.getElementById('cover').classList.add('hidden');
            document.body.style.backgroundColor = '#FFA500'; // Flash orange background
            setTimeout(() => {
                document.body.style.backgroundColor = '#FFD700'; // Then stay Yellow
            }, 1000);
        }
    </script>
</body>
</html>
